services:
  app:
    build: 
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "8501:8501"
    develop:
      watch:
        - action: sync
          path: ./streamlit_app
          target: /app/streamlit_app
    depends_on:
      - backend

  db:
    image: mysql:8
    # platform: linux/amd64   #Uncomment this line for Mac users
    restart: always
    env_file:
      - ./.env
    volumes:
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    expose:
      - "3306"

  backend:
    build: 
      context: .
      dockerfile: ./Dockerfile3
    restart: always
    depends_on:
      - db
    env_file: .env
    ports:
      - "5000:5000"